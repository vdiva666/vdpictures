<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VD Pictures</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VD Pictures">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky slate header with tabs; each view = a heading row + scannable lists; edits happen in a side sheet. */
:root{
  --bg:#121212;--surface:#1a1a1a;--raise:#222222;--line:#303030;--ink:#ececec;--mute:#9c9c9c;
  --accent:#e3a33b;--accent-ink:#1b1305;--accent-soft:rgba(227,163,59,.14);
  --ok:#5cc28e;--bad:#ef7a6a;--pre:#7ea9e6;--post:#b495ea;--shade:rgba(0,0,0,.55);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;--logo-filter:none;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eceef1;--surface:#ffffff;--raise:#f5f6f8;--line:#d6dae0;--ink:#15181c;--mute:#5b636d;
  --accent:#a8640b;--accent-ink:#ffffff;--accent-soft:rgba(168,100,11,.1);
  --ok:#1c7a4e;--bad:#b3392a;--pre:#2d60a8;--post:#6c47b3;--shade:rgba(20,24,28,.35);--logo-filter:invert(1) brightness(.12);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eceef1;--surface:#ffffff;--raise:#f5f6f8;--line:#d6dae0;--ink:#15181c;--mute:#5b636d;
  --accent:#a8640b;--accent-ink:#ffffff;--accent-soft:rgba(168,100,11,.1);
  --ok:#1c7a4e;--bad:#b3392a;--pre:#2d60a8;--post:#6c47b3;--shade:rgba(20,24,28,.35);--logo-filter:invert(1) brightness(.12);color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;justify-content:center;padding-block:18px 10px}
.logo{display:block;width:min(400px,68vw);height:auto;max-width:100%;filter:var(--logo-filter)}
.hrow .sync{justify-self:end}
@media (max-width:560px){.sync span{display:none}}
.mark{display:flex;align-items:baseline;gap:10px;min-width:0}
.mark b{font:800 22px/1 var(--f-display);font-stretch:125%;letter-spacing:.04em}
.mark span{font:500 11px var(--f-mono);color:var(--mute);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.sync{font:500 11px var(--f-mono);color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mute);display:inline-block}
.sync.on i{background:var(--ok)}.sync.err i{background:var(--bad)}
nav{display:flex;justify-content:space-between;align-items:center;gap:16px;overflow-x:auto;scrollbar-width:none}
.nmain{display:flex;gap:2px;flex:none}
nav a.nrub{flex:none;font-size:13px;font-weight:500;padding:6px 12px;border:1px solid var(--line);border-radius:99px;margin-block:4px 6px}
nav a.nrub[aria-current="page"]{border-color:var(--accent);color:var(--ink)}
.rtabs{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.rtabs .kicker{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--surface)}
.seg a{text-decoration:none;color:var(--mute);font-weight:600;font-size:14px;padding:5px 14px;border-radius:99px;display:flex;gap:6px;align-items:center}
.seg a[aria-current="page"]{background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.seg em{font:500 11px var(--f-mono);font-style:normal;color:var(--mute)}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--mute);font:600 14px var(--f-body);padding:10px 12px 11px;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav a em{font:500 11px var(--f-mono);font-style:normal;color:var(--mute);background:var(--raise);border:1px solid var(--line);border-radius:99px;padding:0 6px}

main{padding-block:24px 96px}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;margin-bottom:18px}
h1{font:800 clamp(26px,5vw,34px)/1.05 var(--f-display);font-stretch:112%;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:700 13px var(--f-display);font-stretch:118%;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:0 0 10px}
.kicker{font:500 12px var(--f-mono);color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;padding:8px 14px;border-radius:var(--r);cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--mute);filter:none}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:24px}
.kpis div,.kpis .kpi{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.kpis div:first-child,.kpis .kpi:first-child{border-left:0}
.kpis .kpi{all:unset;box-sizing:border-box;padding:14px 16px;border-left:1px solid var(--line);cursor:pointer;position:relative;display:block;min-width:0}
.kpis .kpi:first-child{border-left:0}
.kpis .kpi em{position:absolute;right:14px;top:14px;font-style:normal;color:var(--mute);transition:transform .15s,color .15s}
.kpis .kpi:hover{background:var(--raise)}.kpis .kpi:hover em{color:var(--accent);transform:translateX(3px)}
.kpis .kpi:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.kpis b{display:block;font:700 24px/1.1 var(--f-display);font-stretch:105%;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis span{font-size:13px;color:var(--mute)}
.kpis .hot b{color:var(--bad)}
.kpis .warm b{color:var(--accent)}
.kpis.k2,.kpis.k4{grid-template-columns:repeat(var(--n,4),minmax(0,1fr))}.kpis.k2{--n:2}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis div:nth-child(3){border-left:0}.kpis div:nth-child(n+3){border-top:1px solid var(--line)}}

.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px}
.box.pad{padding:16px}
.sec{margin-bottom:24px}

/* Pipeline strip */
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.pipe>button{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);padding:12px 14px;border-top:3px solid var(--c);min-width:0}
.pipe>button:hover{background:var(--raise)}
.pipe>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.pipe b{font:700 26px/1 var(--f-display);display:block;font-variant-numeric:tabular-nums}
.pipe span{font-size:13px;color:var(--mute)}
.pipe small{display:block;font:500 12px var(--f-mono);color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Rows */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row.click{cursor:pointer}
.row.click:hover .t{color:var(--accent)}
.row .m{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:2px}
.row .r{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.kt{display:inline-block;font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:1px 5px;margin-right:6px;vertical-align:1px;border:1px solid currentColor}
.kt-video{color:var(--accent)}.kt-foto{color:var(--pre)}.kt-grafica{color:var(--post)}
.no-eq .eq{display:none!important}
.no-cost .eqcost{display:none!important}
.amt{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.code{font:500 12px var(--f-mono);color:var(--mute);letter-spacing:.02em;white-space:nowrap}
.empty{color:var(--mute);padding:16px 0;font-size:14px}
.grp{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:16px 0 4px;display:flex;gap:8px;align-items:center}
.grp.bad{color:var(--bad)}
.grp:first-child{padding-top:8px}

.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-body);padding:2px 9px;border-radius:99px;border:1px solid var(--c);color:var(--c);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.ph{display:flex;gap:3px}
.ph i{width:16px;height:4px;border-radius:2px;background:var(--line)}
.ph i.on{background:var(--c)}

/* Agenda */
.ag{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.ag:first-child{border-top:0}
.ag .d{font:500 12px/1.3 var(--f-mono);color:var(--mute);text-transform:uppercase}
.ag .d b{display:block;font:700 18px/1.1 var(--f-display);color:var(--ink)}
.ag .k{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.ag .t{font-weight:600;overflow-wrap:anywhere}
.ag:hover .t{color:var(--accent)}
.ag.late .d,.ag.late .d b{color:var(--bad)}

/* Check */
.chk{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--mute);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on::after{content:"";width:6px;height:11px;border:solid var(--bg);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.done .t{text-decoration:line-through;color:var(--mute)}
.due{font-family:var(--f-mono);font-size:12px}
.due.late{color:var(--bad)}

/* Toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:500;cursor:pointer;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1 1 200px;min-width:0}
input,select,textarea{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{min-height:64px;resize:vertical}

.quick{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 150px minmax(0,1fr) auto;gap:8px;margin-bottom:16px}
@media (max-width:820px){.quick{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.quick input:first-child{grid-column:1/-1}}

/* Sheet */
.shade{position:fixed;inset:0;background:var(--shade);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.sheet.wide{width:min(700px,100%)}
.sheet .sh h3{margin:0;font:800 20px/1.15 var(--f-display);font-stretch:110%;overflow-wrap:anywhere}
.sheet .sb{flex:1;overflow-y:auto;padding:14px 18px 20px}
.sheet .sf{display:flex;justify-content:space-between;gap:8px;padding:10px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{background:none;border:1px solid var(--line);border-radius:6px;width:34px;height:34px;cursor:pointer;flex:none;font-size:18px;line-height:1;color:var(--mute)}
.x:hover{color:var(--ink);border-color:var(--mute)}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 10px}
.form .c2{grid-column:span 2}.form .c3{grid-column:span 3}.form .c4{grid-column:span 4}
.sheet .form input,.sheet .form select,.sheet .form textarea{padding:6px 8px;font-size:14px}
@media (max-width:560px){.form{grid-template-columns:repeat(2,minmax(0,1fr))}.form .c2{grid-column:span 1}.form .c3,.form .c4{grid-column:1/-1}}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);font-weight:500;min-width:0}
.form .w{grid-column:1/-1}
.form label.cb{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.form label.cb input{width:auto}
.sub{margin-top:18px}
.fs-tp{margin-top:0}
.pvwrap{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.72);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pvbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.pvscroll{flex:1;overflow:auto;padding:24px 16px}
.pvpage{background:#fff;color:#111;width:min(794px,100%);min-height:min(1123px,140vw);margin:0 auto;padding:clamp(20px,6%,60px);box-shadow:0 10px 40px rgba(0,0,0,.5);font:400 14px/1.45 Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
.pvlogo{display:block;width:min(300px,60%);height:auto;margin:0 auto 34px;filter:invert(1) brightness(0)}
.pvk{font-size:11px;letter-spacing:.06em;color:#6e6e6e;white-space:pre}
.pvt{font:700 26px/1.2 Helvetica,Arial,sans-serif;margin:6px 0 10px;color:#000;text-transform:none;letter-spacing:0}
.pvm{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;margin:0 0 22px;font-size:14px}
.pvm dt{font-weight:700}.pvm dd{margin:0;color:#282828}
.pvtab{width:100%;border-collapse:collapse;font-size:14px}
.pvtab th{background:#141414;color:#fff;text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:7px 8px}
.pvtab td{padding:7px 8px;vertical-align:top}.pvtab tr:nth-child(odd) td{background:#f2f2f2}
.pvtab td:first-child{font-weight:700;white-space:nowrap;width:110px}.pvtab td:last-child{color:#464646}
@media print{body.printing-tp>*:not(#tpPreview){display:none!important}body.printing-tp{background:#fff}body.printing-tp #tpPreview{position:static;background:#fff;padding:0}body.printing-tp .pvbar{display:none}body.printing-tp .pvscroll{overflow:visible;padding:0}body.printing-tp .pvpage{box-shadow:none;width:auto;min-height:0;padding:0}@page{size:A4;margin:14mm}}
.pvf{margin-top:auto;padding-top:30px;font-size:10px;color:#828282}
.stabs{padding:10px 18px;border-bottom:1px solid var(--line)}
.crewbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--raise);transition:background .3s}
.crewbar.both{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 18%,var(--raise)),color-mix(in srgb,var(--post) 18%,var(--raise)))}
.crew-l{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.crew-opts{display:flex;align-items:center}
.who{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;border:1.5px dashed var(--line);color:var(--mute);font:600 14px var(--f-body);transition:border-color .2s,color .2s,background .2s}
.who i{font:800 13px/1 var(--f-display);font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--mute);transition:all .2s}
.who:hover{color:var(--ink);border-color:var(--c)}
.who.on{border-style:solid;border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 14%,transparent)}
.who.on i{background:var(--c);border-color:var(--c);color:var(--accent-ink)}
.who:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.amp{width:22px;height:2px;margin:0 2px;background:var(--line);border-radius:2px;transition:background .3s,width .3s}
.crewbar.both .amp{width:30px;background:linear-gradient(90deg,var(--accent),var(--post))}
.crew-s{font-size:13px;color:var(--mute);margin-left:auto}
.crewbar.both .crew-s{color:var(--ink);font-weight:600}
.crewbar.none .crew-s{font-style:italic}
@media (prefers-reduced-motion:no-preference){.who.pop i{animation:pop .35s ease-out}@keyframes pop{40%{transform:scale(1.25)}}}
.rtop{display:flex;align-items:center;gap:8px}
.crewdots{display:inline-flex}
.crewdots i{font:800 10px/1 var(--f-display);font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--accent-ink);border:2px solid var(--surface)}
.crewdots i+i{margin-left:-6px}
.whof{display:inline-flex;gap:4px;flex-wrap:wrap}
.whof button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 11px 4px 5px;font-size:13px;font-weight:500;cursor:pointer;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.whof button:first-child{padding-left:11px}
.whof .duo{display:inline-flex}.whof .duo i+i{margin-left:-6px}
.whof button[aria-pressed="true"] .duo i{background:var(--c);color:var(--accent-ink)}
.whof button i{font:800 10px/1 var(--f-display);font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--c);color:var(--c)}
.whof button[aria-pressed="true"]{color:var(--ink);border-color:var(--c,var(--ink))}
.whof button[aria-pressed="true"] i{background:var(--c);color:var(--accent-ink)}
.stabs .seg{display:flex;width:100%}
.stabs .seg button{all:unset;flex:1;text-align:center;cursor:pointer;color:var(--mute);font:600 14px var(--f-body);padding:7px 10px;border-radius:99px;display:flex;justify-content:center;gap:6px;align-items:center}
.stabs .seg button:hover{color:var(--ink)}
.stabs .seg button[aria-selected="true"]{background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.stabs .seg button[data-stab="attrezzatura"][aria-selected="true"]{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stabs .seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stabs em{font:500 11px var(--f-mono);font-style:normal;color:var(--mute)}
.fsets [data-tab]+[data-tab]{margin-top:0}
.tphead,.tprow{display:grid;grid-template-columns:118px 118px minmax(0,1.3fr) minmax(0,1fr) 32px;gap:6px;align-items:center}
.tphead{font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.tprow{margin-bottom:6px}
.tprow input,.tprow select{padding:6px 8px;font-size:14px;background:var(--surface)}
.tm{display:flex;align-items:center;gap:3px}.tm select{-webkit-appearance:none;appearance:none;width:auto;flex:1;min-width:0;padding:6px 4px;text-align:center;text-align-last:center;font:600 16px/1.2 var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--ink);cursor:pointer}
.tm b{color:var(--ink);font:600 16px var(--f-body)}
.tpa{display:flex;flex-direction:column;gap:4px;min-width:0}
.tprow .x{width:32px;height:32px}
.tpact{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px}
@media (max-width:560px){.tphead{display:none}.tprow{grid-template-columns:1fr 1fr 32px;padding-bottom:8px;border-bottom:1px solid var(--line)}.tprow .tpa{grid-column:1/3;grid-row:2}.tprow .tp-n{grid-column:1/3;grid-row:3}.tprow .tp-x{grid-row:1;grid-column:3}}
.fsets{display:flex;flex-direction:column;gap:14px}
.fs{margin:0;min-width:0;border:1px solid var(--line);border-radius:var(--r);background:var(--raise);padding:12px 12px 14px}
.fs legend{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.fs .form input,.fs .form select,.fs .form textarea{background:var(--surface)}
.fs-eq{border-color:var(--accent);background:var(--accent-soft)}
.fs-eq legend{color:var(--accent);border-color:var(--accent)}
.flab{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute);font-weight:500}
#supBox{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
#supBox #supAdd{width:auto;max-width:100%;flex:0 1 240px}
#supBox .supnew{flex:1 1 100%}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:99px;padding:3px 4px 3px 11px;font-size:13px;font-weight:500}
.tag button{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--mute);font-size:15px;line-height:1}
.tag button:hover{color:var(--bad)}
.supnew{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise)}
.supnew[hidden]{display:none}
.locnew{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.locnew[hidden]{display:none}
@media (max-width:480px){.locnew{grid-template-columns:minmax(0,1fr)}}
.supnew-h{grid-column:1/-1;font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.supnew-a{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}
.supnew input,.supnew select{background:var(--surface)}
@media (max-width:480px){.supnew{grid-template-columns:minmax(0,1fr)}}
.fhd{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.dl2{display:flex;gap:6px}.dl2 select{flex:0 0 auto;width:auto}.dl2 input{flex:1}
.copy{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:13px;user-select:all;overflow-wrap:anywhere}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-align:left}
.lnk:hover{text-decoration:underline}
.crow{border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.chead{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:13px 0;cursor:pointer}
.chead.static{cursor:default}
.chead .t{font-weight:600;overflow-wrap:anywhere;min-width:0}
.chead:hover .t,.crow.open .chead .t{color:var(--accent)}
.chead:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.chev{flex:none;width:9px;height:9px;border:solid var(--mute);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.crow.open .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.cpanel{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.info{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 20px;margin:0}
.info dt{color:var(--mute);font-size:13px;padding-top:2px}
.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pre{white-space:pre-wrap}
.btn.mini{padding:2px 8px;font-size:12px;vertical-align:1px}
.cact{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}
@media (max-width:480px){.info{grid-template-columns:minmax(0,1fr);gap:2px}.info dd{margin-bottom:8px}}

.note{background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:14px;margin-bottom:16px}
.hero-empty{padding:28px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.hero-empty p{max-width:60ch;color:var(--mute);margin:6px 0 16px}
footer{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;color:var(--mute);font-size:13px}
.login{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px))}
.login[hidden]{display:none}
.login-card{width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.login-card label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);font-weight:500}
.login-logo{width:100%;height:auto;margin-bottom:18px;filter:var(--logo-filter)}
.pwrow{display:flex;gap:6px}.pwrow input{flex:1}.pwrow .btn{padding:6px 12px;font-size:13px}
.login-err{color:var(--bad);min-height:1.2em;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100vw - 32px)}
/* telefoni: campi a 16px, così Safari non ingrandisce la pagina quando li tocchi */
@media (pointer:coarse),(max-width:820px){input,select,textarea,.sheet .form input,.sheet .form select,.sheet .form textarea,.tprow input,.tprow select,.tm select{font-size:16px!important}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

/* ---------- scritture ---------- */
function guard(){if(!db){toast(initDone?'Dati non disponibili qui: vedi l’avviso in alto':'Sto ancora collegando i dati, riprova tra un attimo');return false}if(readOnly){toast('Sola lettura');return false}return true}
function onErr(e){
  const m=(e&&(e.message||e.code))||'';
  if(/row-level security|permission|42501/i.test(m)){readOnly=true;note('Il tuo account può solo leggere: chiedi a Matteo di darti i permessi di modifica.');toast('Modifica non consentita');return}
  if(/JWT|session|401/i.test(m)){toast('Sessione scaduta: accedi di nuovo');showLogin();return}
  toast('Salvataggio non riuscito, riprova');console.error(e);
}
function upsertLocal(col,id,data){if(!S[col])return;const i=S[col].findIndex(x=>x.id===id);const row={id,...data};if(i>=0)S[col][i]=row;else S[col].push(row)}
async function saveDoc(col,id,data){
  if(!guard())return null;
  const now=new Date().toISOString();data.updatedAt=now;
  try{
    let body;
    if(id){const cur=byId(S[col],id)||{};const {id:_,...rest}=cur;body={...rest,...data}}
    else{id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,'').slice(0,20);data.createdAt=now;body=data}
    const {error}=await db.from('docs').upsert({col,id,data:body});
    if(error)throw error;
    upsertLocal(col,id,body);renderAll();return id;
  }catch(e){onErr(e);return null}
}
async function delDoc(col,id){if(!guard())return false;try{const {error}=await db.from('docs').delete().eq('col',col).eq('id',id);if(error)throw error;S[col]=S[col].filter(x=>x.id!==id);renderAll();return true}catch(e){onErr(e);return false}}
async function toggleTask(id){
  const t=byId(S.tasks,id);if(!t)return;const done=!t.done;
  await saveDoc('tasks',id,{done,doneAt:done?new Date().toISOString():null});
}
function nextCode(kind='video'){
  const yy=String(new Date().getFullYear()).slice(2),pre=KIND[kind].pre+'-'+yy+'-';
  let max=0;for(const p of S.productions){if(p.code&&p.code.startsWith(pre)){const n=parseInt(p.code.slice(pre.length),10);if(n>max)max=n}}
  return pre+String(max+1).padStart(3,'0');
}

const pill=(k,kind)=>`<span class="pill" style="--c:${statusColor(k)}">${esc(stLabel(k,kind))}</span>`;
function phaseBar(k){const s=ST[k];const ph=s?s.ph:-1;const c=statusColor(k);
  return `<span class="ph" style="--c:${c}" aria-hidden="true">${[0,1,2,3].map(i=>`<i class="${(ph>=i||ph===4)?'on':''}"></i>`).join('')}</span>`}
const clientName=id=>{const c=byId(S.clients,id);return c?(c.company||c.name):''};
function prodLabel(p){return p?`${p.code?p.code+' · ':''}${p.title}`:''}

function prodRow(p){
  const cl=clientName(p.clientId);
  const kd=kindOf(p),asap=isAsap(p);const dates=[p.shootDate&&`${KIND[kd].shoot} ${fmtD(p.shootDate)}`,asap?'Consegna ASAP':p.deliveryDate&&`Consegna ${fmtD(p.deliveryDate)}`].filter(Boolean);

  return `<div class="row click" data-open="productions:${p.id}">
    <div class="m"><div class="code"><span class="kt kt-${kd}">${KIND[kd].l}</span>${esc(p.code||'')}${p.type?' · '+esc(p.type):''}</div>
      <div class="t">${esc(p.title)}</div>
      <div class="s">${cl?`<span>${esc(cl)}</span>`:''}${dates.map((d,i)=>`<span class="${late&&i===dates.length-1?'due late':''}">${esc(d)}</span>`).join('')}${eqWarn?`<span class="due late">Attrezzatura da ordinare</span>`:''}${p.equipPay==='dapagare'?`<span class="due late">Noleggio da pagare${p.equipCost?' · '+money(p.equipCost):''}</span>`:''}</div></div>
    <div class="r"><span class="rtop">${crewDots(p.crew)}${pill(p.status,kindOf(p))}</span>${phaseBar(p.status)}${p.amount?`<span class="amt">${money(p.amount)}</span>`:''}</div></div>`;

function taskRow(t,showProd=true){
  const p=byId(S.productions,t.productionId);const today=todayISO();
  const late=!t.done&&t.due&&t.due<today;
  const meta=[];
  if(showProd&&p)meta.push(`<button class="lnk" data-open="productions:${p.id}">${esc(prodLabel(p))}</button>`);
  if(t.due)meta.push(`<span class="due ${late?'late':''}">${t.due===today?'Oggi':esc(fmtDW(t.due))}</span>`);
  if(t.assignee)meta.push(`<span>${esc(t.assignee)}</span>`);
  if(t.done&&t.doneAt)meta.push(`<span>Fatta il ${esc(fmtD(t.doneAt.slice(0,10)))}</span>`);
  return `<div class="row ${t.done?'done':''}">
    <button class="chk ${t.done?'on':''}" data-toggle="${t.id}" aria-label="${t.done?'Segna da fare':'Segna come fatta'}: ${esc(t.title)}"></button>
    <div class="m"><div class="t row-t click" data-open="tasks:${t.id}" style="cursor:pointer">${esc(t.title)}</div><div class="s">${meta.join('')}</div></div></div>`;

    const ps=S.productions.filter(p=>ST[p.status]?.ph===i);

  const end=addDays(today,14),items=[];

  }
  for(const t of S.tasks){if(!t.done&&t.due&&t.due>=today&&t.due<=end){const p=byId(S.productions,t.productionId);items.push({d:t.due,k:'Scadenza',c:'var(--pre)',t:t.title,s:p?prodLabel(p):'',o:'tasks:'+t.id})}}

async function submitSheet(){
  const {col,id}=sheet,spec=SPEC[col],fm=$('#shForm'),data={};
  for(const f of spec.fields){
    if(f.type==='hd')continue;
    if(f.type==='suppliers'){data.equipSuppliers=(sheet.sup||[]).slice();continue}
    if(f.type==='client'){let cv=fm.elements.clientId.value;if(cv==='__new'){const filled=$('#cliNewCompany').value.trim()||$('#cliNewName').value.trim();cv=filled?await createClientFromSheet():'';if(cv===null)return}data.clientId=cv;continue}
    if(f.type==='location'&&data.kind==='grafica'){data.location='';data.locationSupplierId='';continue}
    if(f.type==='location'){let sv=fm.elements.locSel.value;if(sv==='__new'){sv=$('#locNewName').value.trim()?await createLocation():'';if(sv===null)return}data.locationSupplierId=(sv&&sv!=='__legacy')?sv:'';data.location=sv==='__legacy'?fm.elements.locSel.options[fm.elements.locSel.selectedIndex].text:(sv?locLabel(byId(S.suppliers,sv)||{name:''}):'');continue}
    if(f.type==='delivery'){const m=fm.elements.deliveryMode.value;data.deliveryMode=m;data.deliveryDate=m==='asap'?'':fm.elements.deliveryDate.value;continue}
    const el=fm.elements[f.k];if(!el)continue;
    if(f.type==='check')data[f.k]=el.checked;
    else if(f.type==='number')data[f.k]=el.value===''?null:Number(el.value);
    else data[f.k]=el.value.trim();}
  for(const f of spec.fields)if(f.k&&f.req&&!data[f.k]){toast('Compila: '+f.l);if(col==='productions')showTab('lavoro');fm.elements[f.k].focus();return}
  if(col==='productions'&&!['dapagare','pagato'].includes(data.equipPay))data.equipCost=null;
  if(col==='productions'){const prev=id?byId(S.productions,id):null;if(!id||kindOf(prev)!==data.kind)data.code=nextCode(data.kind)}
  if(col==='tasks'){const prev=id?byId(S.tasks,id):null;if(data.done&&!(prev&&prev.done))data.doneAt=new Date().toISOString();if(!data.done)data.doneAt=null}
  if(col==='productions'&&$('#tpRows'))data.timePlan=data.kind==='grafica'?(byId(S.productions,id)?.timePlan||[]):sortTP(readTP());
  if(col==='productions')data.crew=(sheet.crew||[]).slice();
  const r=await saveDoc(col,id,data);
  if(r){toast(id?'Modifiche salvate':'Creato');closeSheet()}
}

const TP_PRESETS=['Inizio giornata','Fine giornata'];
function timeSel(v,cls,lab){
  const [h,m]=(v||'').split(':');
  const hs=['<option value="">--</option>'].concat([...Array(24)].map((_,i)=>{const x=pad(i);return `<option ${x===h?'selected':''}>${x}</option>`})).join('');
  const mins=['00','10','20','30','40','50'];if(m&&!mins.includes(m))mins.push(m),mins.sort();
  const ms=mins.map(x=>`<option ${x===(m||'00')?'selected':''}>${x}</option>`).join('');
  return `<span class="tm ${cls}" role="group" aria-label="${lab}"><select class="tm-h" aria-label="${lab}: ore">${hs}</select><b>:</b><select class="tm-m" aria-label="${lab}: minuti">${ms}</select></span>`;
}
const tmVal=el=>{const h=el.querySelector('.tm-h').value;return h?h+':'+el.querySelector('.tm-m').value:''};
function tmSet(el,v){const [h,m]=(v||'').split(':');el.querySelector('.tm-h').value=h||'';const ms=el.querySelector('.tm-m');if(m&&![...ms.options].some(o=>o.value===m))ms.add(new Option(m,m));ms.value=m||'00'}

async function makeTimePlanPDF(btn){
  if(!window.jspdf){toast('Generatore PDF non caricato: ricarica la pagina');return}
  if(!dl){toast('Download non disponibile in questa visualizzazione');return}
  const fm=$('#shForm');const title=(fm.elements.title?.value||'').trim()||'Senza titolo';
  const date=fm.elements.shootDate?.value||'';const loc=(fm.elements.location?.value||'').trim();
  const rec=sheet?.id?byId(S.productions,sheet.id):null;const code=rec?.code||'';
  const rows=sortTP(readTP());
  if(!rows.length){toast('Aggiungi almeno una riga al time plan');return}
  btn.disabled=true;const old=btn.textContent;btn.textContent='Creo il PDF…';
  try{
    const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
    const W=210,M=16;let y=14;
    const lg=await getLogoBlack();
    if(lg){const lw=70,lh=lw*lg.h/lg.w;doc.addImage(lg.url,'PNG',(W-lw)/2,y,lw,lh);y+=lh+10}
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(110);doc.text('TIME PLAN'+(code?'   ·   '+code:''),M,y);y+=8;
    doc.setFont('helvetica','bold');doc.setFontSize(20);doc.setTextColor(0);
    const tl=doc.splitTextToSize(title,W-2*M);doc.text(tl,M,y);y+=tl.length*8+1;
    doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(40);
    const dstr=date?new Date(date+'T12:00:00').toLocaleDateString('it-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Data da definire';
    doc.setFont('helvetica','bold');doc.text('Data',M,y);doc.setFont('helvetica','normal');doc.text(dstr.charAt(0).toUpperCase()+dstr.slice(1),M+24,y);y+=6;
    doc.setFont('helvetica','bold');doc.text('Location',M,y);doc.setFont('helvetica','normal');const ll=doc.splitTextToSize(loc||'Da definire',W-2*M-24);doc.text(ll,M+24,y);y+=ll.length*5+6;
    const cx=[M,M+30,M+112],cw=[28,80,W-M-(M+112)];
    const head=()=>{doc.setFillColor(20,20,20);doc.rect(M,y-5,W-2*M,8,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(9);
      doc.text('ORARIO',cx[0]+2,y);doc.text('ATTIVITÀ',cx[1],y);doc.text('NOTE / CHI',cx[2],y);y+=8;doc.setTextColor(0);doc.setFont('helvetica','normal');doc.setFontSize(11)};
    head();
    rows.forEach((r,i)=>{
      const time=r.s&&r.e?`${r.s}–${r.e}`:(r.s||r.e||'');
      const a=doc.splitTextToSize(r.a||'',cw[1]),n=doc.splitTextToSize(r.n||'',cw[2]);
      const h=Math.max(a.length,n.length,1)*5+4;
      if(y+h>280){doc.addPage();y=20;head()}
      if(i%2===0){doc.setFillColor(242,242,242);doc.rect(M,y-5,W-2*M,h,'F')}
      doc.setFont('helvetica','bold');doc.text(time,cx[0]+2,y);doc.setFont('helvetica','normal');doc.text(a,cx[1],y);doc.setTextColor(70);doc.text(n,cx[2],y);doc.setTextColor(0);
      y+=h;
    });
    const n=doc.getNumberOfPages(),gen=new Date().toLocaleDateString('it-CH');
    for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(130);doc.text(`VD Pictures · Video & Photo Productions · creato il ${gen}`,M,290);doc.text(`${i}/${n}`,W-M,290,{align:'right'})}
    const safe=(code?code+'_':'')+title.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
    await dl.save({filename:`TimePlan_${safe||'lavoro'}.pdf`,data:doc.output('blob')});
    toast('PDF pronto: aprilo o stampalo dal file scaricato');
  }catch(e){if(e&&e.code==='declined'){}else{console.error(e);toast('PDF non creato, riprova')}}
  finally{btn.disabled=false;btn.textContent=old}
}

  if(t.dataset.tprm!==undefined&&t.hasAttribute('data-tprm')){const r=readTP(true);r.splice(+t.closest('.tprow').dataset.i,1);$('#tpRows').innerHTML=tpRows(r.length?r:[{s:'',e:'',a:'',n:''}]);return}
  if(t.id==='tpSort'){$('#tpRows').innerHTML=tpRows(sortTP(readTP()).concat([]).length?sortTP(readTP()):[{s:'',e:'',a:'',n:''}]);return}

  if(t.id==='pvClose'){closePreview();return}
  if(t.id==='pvPrint'){document.body.classList.add('printing-tp');window.print();setTimeout(()=>document.body.classList.remove('printing-tp'),500);return}
  if(t.dataset.cx){if(cDirty&&cOpen!==t.dataset.cx){toast('Salva o annulla le modifiche prima');return}cOpen=cOpen===t.dataset.cx?null:t.dataset.cx;cEdit=false;cDirty=false;renderClients(true);return}

  if(t.hasAttribute('data-ccancel')){cEdit=false;cDirty=false;if(cOpen==='new')cOpen=null;renderClients(true);return}
  if(t.dataset.cdel){const id=t.dataset.cdel;
    if(S.productions.some(p=>p.clientId===id)){toast('Questo cliente ha produzioni: spostale o eliminale prima');return}
    if(cArm!==id){cArm=id;t.classList.add('arm');t.textContent='Conferma eliminazione';setTimeout(()=>{if(cArm===id){cArm=null;t.classList.remove('arm');t.textContent='Elimina'}},4000);return}
    cArm=null;if(await delDoc('clients',id)){cOpen=null;cEdit=false;cDirty=false;toast('Cliente eliminato');renderClients(true)}return}
  if(t.dataset.toggle){e.stopPropagation();toggleTask(t.dataset.toggle);return}
  if(t.dataset.lw){listWho=t.dataset.lw;$('#listWho').innerHTML=listWhoBar();$('#listBody').innerHTML=listBody(sheet.key);return}
  if(t.dataset.list){openList(t.dataset.list);return}
  if(t.dataset.open){const [c,i]=t.dataset.open.split(':');e.preventDefault();openSheet(c,i,{},sheet&&sheet.col==='list'?sheet.key:null);return}
  if(t.dataset.new==='clients'){newClientInline();return}
  if(t.dataset.new==='suppliers'){newSupplierInline();return}
  if(t.dataset.new){const pre={};if(t.dataset.client)pre.clientId=t.dataset.client;if(t.dataset.kind)pre.kind=t.dataset.kind;else if(t.dataset.new==='productions'&&KIND[view])pre.kind=view;openSheet(t.dataset.new,null,pre);return}
  if(t.hasAttribute('data-close')){closeSheet();return}
  if(t.dataset.pf){pFilter=t.dataset.pf;renderProds();return}
  
  if(t.dataset.tt){tTab=t.dataset.tt;renderTasks();return}

  if(t.id==='delBtn'){deleteCurrent(t);return}
  if(t.id==='loadSamples'){loadSamples(t);return}
  if(t.id==='clearSamples'){clearSamples(t);return}
  if(t.id==='exportBtn'){exportAll();return}

/* ---------- esportazione (per il passaggio a Supabase) ---------- */
async function exportAll(){
  if(!dl){toast('Esportazione non disponibile qui');return}
  const strip=a=>a.map(({sample,...r})=>r);
  const data=JSON.stringify({exportedAt:new Date().toISOString(),app:'VD Pictures',clients:strip(S.clients),productions:strip(S.productions),tasks:strip(S.tasks),suppliers:strip(S.suppliers)},null,2);
  try{await dl.save({filename:'vd-pictures-'+todayISO()+'.json',data});toast('File pronto')}
  catch(e){if(e.code!=='declined')toast('Esportazione non riuscita')}
}

/* ---------- Supabase ---------- */
const SB_URL='https://wgwamhrvybkxpqmacgwk.supabase.co';
const SB_KEY='sb_publishable_agPjXw7UJjXkC2ZnSaVjKg_R9qv5w7E';
let sb=null,channel=null;
function showLogin(msg){$('#sblogin').hidden=false;$('#sbErr').textContent=msg||'';setTimeout(()=>$('#sbEmail').focus(),30)}
function hideLogin(){$('#sblogin').hidden=true}
async function loadAll(){
  const out={clients:[],productions:[],tasks:[],suppliers:[]};let from=0;
  for(;;){const {data,error}=await sb.from('docs').select('col,id,data').range(from,from+999);if(error)throw error;
    for(const r of data)if(out[r.col])out[r.col].push({id:r.id,...r.data});if(data.length<1000)break;from+=1000}
  Object.assign(S,out);for(const k in S.ready)S.ready[k]=true;renderAll();
}
function subscribe(){
  if(channel)sb.removeChannel(channel);
  channel=sb.channel('docs-sync').on('postgres_changes',{event:'*',schema:'public',table:'docs'},pl=>{
    if(pl.eventType==='DELETE'){const o=pl.old||{};if(S[o.col])S[o.col]=S[o.col].filter(x=>x.id!==o.id)}
    else{const r=pl.new;upsertLocal(r.col,r.id,r.data)}
    renderAll();
  }).subscribe();
}
async function startSession(){
  hideLogin();note('');
  try{
    db=sb;initDone=true;
    const {data:{user}}=await sb.auth.getUser();
    const {data:prof}=await sb.from('profiles').select('role,name').eq('id',user.id).maybeSingle();
    readOnly=!prof||!['admin','member'].includes(prof.role);
    if(!prof){note('Il tuo account non è ancora abilitato. Chiedi a Matteo di aggiungerti.');}
    else if(readOnly)note('Hai accesso in sola lettura.');
    $('#whoami').textContent=(prof&&prof.name)||user.email;
    await loadAll();subscribe();
  }catch(e){console.error(e);note('I dati non si sono caricati. Ricarica la pagina tra poco.')}
}
(async function init(){
  route();renderAll();$('#loginLogo').src=document.querySelector('.logo').src;
  dl={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return{status:'saved'}}};
  $('#exportBtn').hidden=false;
